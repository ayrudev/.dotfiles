general {
    hide_cursor = true
    fail_timeout = 2000
}

background {
    path = ~/Pictures/wallpapers/dark/03.png
    blur_passes = 2
    blur_size = 8
}

input-field { 
    rounding = 3
    size = 10%, 5%
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(255, 255, 255, 1) 
    inner_color = rgba(0, 0, 0, 0.8) 
    check_color = rgba(255, 210, 75, 1)
    font_color = rgba(255, 255, 255, 1)
    fade_on_empty = true
    placeholder_text = 
    hide_input = false
    position = 0, 5%
    halign = center
    valign = bottom
    fail_color = rgb(204, 34, 34)
}

label {
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgb(255, 255, 255)
  font_size = 50
  font_family = JetBrainsMono Nerd Font Bold
  position = 0, -14%
  halign = center
  valign = top
}

label {
  text = cmd[update:1000] echo "$(date +"%k:%M")"
  color = rgb(255, 255, 255)
  font_size = 250
  font_family = JetBrainsMono Nerd Font Bold
  position = 0, -15%
  halign = center
  valign = top
}

image {
  monitor =
  path = ~/Pictures/pfp-real.jpg 
  border_color = rgb(255, 255, 255)
  border_size = 4
  size = 200
  rounding = -1
  reload_time = -1
  position = 0, 14.5%
  halign = center
  valign = bottom
}

label {
  text = $USER
  color = rgb(255, 255, 255)
  font_size = 25
  font_family = JetBrainsMono Nerd Font 
  position = 0, 11.5%
  halign = center
  valign = bottom
  shadow_passes = 2
  shadow_size = 8
  shadow_color = rgb(60, 56, 54)
}

