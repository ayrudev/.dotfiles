unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[3 q'
set -g focus-events on

unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind x kill-pane
bind & kill-window

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 10
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
setw -g monitor-activity on
set -g visual-activity on

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'        # better copy-to-system-clipboard

set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions manually
set -g @resurrect-capture-pane-contents 'on'   # also save pane text/scrollback

# Tokyo Night Moon colors, minimal bar
set -g status-position bottom
set -g status-style "bg=#222436,fg=#c8d3f5"
set -g status-left "#[fg=#222436,bg=#82aaff,bold] #S #[fg=#82aaff,bg=#222436]"
set -g status-right "#[fg=#636da6] %d/%m #[fg=#c8d3f5] %H:%M "
set -g status-left-length 30
set -g status-right-length 30

set -g window-status-current-style "fg=#82aaff,bold"
set -g window-status-current-format " #I:#W "
set -g window-status-style "fg=#636da6"
set -g window-status-format " #I:#W "

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
run '~/.config/tmux/plugins/tpm/tpm'
